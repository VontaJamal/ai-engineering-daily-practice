[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-daily-practice"
version = "0.1.0"
description = "Cumulative daily exercises for applied AI engineering"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.setuptools.packages.find]
where = ["src"]
